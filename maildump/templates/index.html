<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/png" href="../static/images/icon_16x16.png">
    <title>MailDump</title>
    <link rel="stylesheet" type="text/css" href="../static/css/maildump.scss">
    <script type="module" src="../static/js/maildump.js"></script>
</head>
<body class="loading-message-list">
    <header class="top">
        <h1>
            <a href="https://github.com/ThiefMaster/maildump" title="MailDump ({{ version }})">MailDump</a>
        </h1>
        <nav class="app">
            <ul>
                <li class="search">
                    <input id="search" type="search" name="search" placeholder="Search messages (only header data)...">
                </li>
                <li class="notifications">
                    <a href="#" title="Toggle WebKit desktop notifications">Enable notifications</a>
                </li>
                <li class="clear">
                    <a href="#" title="Delete all messages">Clear</a>
                </li>
                {% if not config.MAILDUMP_NO_QUIT %}
                    <li class="quit">
                        <a href="#" title="Terminate MailDump">Quit</a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </header>
    <nav class="messages">
        <table>
            <thead>
                <tr>
                    <th>From</th>
                    <th>To</th>
                    <th>Subject</th>
                    <th>Received</th>
                </tr>
            </thead>
            <tbody id="messages"></tbody>
        </table>
    </nav>
    <div class="resizer" data-sibling="prev"><div class="ruler"></div></div>
    <article id="message" class="no-message">
        <header>
            <dl class="meta" id="message-metadata"></dl>
            <nav class="views">
                <ul>
                    <li class="tab format html" data-message-format="html">
                        <a href="#">HTML</a>
                    </li>
                    <li class="tab selected format plain" data-message-format="plain">
                        <a href="#">Plain Text</a>
                    </li>
                    <li class="tab format source" data-message-format="source">
                        <a href="#">Source</a>
                    </li>
                    <li class="action download">
                        <a class="button" href="#" target="_blank">
                            <span>Download</span>
                        </a>
                    </li>
                    <li class="action delete">
                        <a class="button" href="#">
                            <span>Delete</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
        <iframe class="body" id="message-body"></iframe>
        <aside class="no-message-mark">
            <div class="no-message">NO MESSAGE SELECTED</div>
            <div class="loading-message">LOADING MESSAGE...</div>
        </aside>
    </article>

    <!-- templates, dialogs, etc. -->

    <!-- Handlebars templates moved to external files for Parcel v2 build -->
    <!-- See: maildump/templates/message.hbs and maildump/templates/message-metadata.hbs -->

    <div class="overlay">
        <div class="modal disconnected">
            <p>Connection to MailDump lost</p>
        </div>
        <div class="modal loading-message-list">
            <p>Loading initial message list</p>
        </div>
    </div>
</body>
</html>
